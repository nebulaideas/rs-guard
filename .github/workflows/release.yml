name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            strip: aarch64-linux-gnu-strip
            cross: true
            cross_packages: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-13
            strip: strip
            cross: false
          - target: aarch64-apple-darwin
            os: macos-14
            strip: strip
            cross: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Install cross-compilation C toolchain for aws-lc-rs (Linux aarch64 only).
      # aws-lc-rs requires a C compiler + cmake for the target arch.
      - name: Install cross-compilation toolchain
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }} cmake
      - name: Configure aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          # aws-lc-rs needs to find the cross-compiler
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Strip binary
        run: ${{ matrix.strip }} target/${{ matrix.target }}/release/rs-guard
      - name: Prepare release asset and checksum
        run: |
          set -euo pipefail
          BINARY="rs-guard-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/rs-guard" "${BINARY}"
          # sha256sum is not available on macOS by default; use shasum as fallback.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${BINARY}" > "${BINARY}.sha256"
          else
            shasum -a 256 "${BINARY}" > "${BINARY}.sha256"
          fi
      # Pinned from softprops/action-gh-release@v2 (3bb12739).
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            rs-guard-${{ matrix.target }}
            rs-guard-${{ matrix.target }}.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish
