name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test

  doc:
    name: Doc Tests
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo test --doc

  build-release:
    name: Release Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo build --release

  binary-size:
    name: Binary Size Budget
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo build --release
      - name: Check binary size against budget
        run: |
          set -euo pipefail
          BINARY="target/release/rs-guard"
          SIZE_BYTES=$(stat -c %s "$BINARY")
          SIZE_MB=$(( (SIZE_BYTES + 1048575) / 1048576 ))
          BUDGET_MB=12
          BUDGET_BYTES=$((BUDGET_MB * 1048576))
          echo "Binary size: ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          echo "Budget: ${BUDGET_MB} MB (${BUDGET_BYTES} bytes)"
          if [ "$SIZE_BYTES" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Binary size ${SIZE_MB} MB exceeds budget of ${BUDGET_MB} MB"
            exit 1
          fi
          echo "✓ Binary size within budget"

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      # Verify rs-guard and llm-kernel share the same reqwest version (no
      # duplicate TLS stack). With reqwest 0.13 and client-async enabled,
      # both crates should resolve to the same reqwest crate.
      - name: Verify shared reqwest version (no duplicate TLS stacks)
        run: |
          set -euo pipefail
          # 1. Check for duplicate reqwest versions.
          reqwest_dup="$(cargo tree -d | grep -c '^reqwest v' || true)"
          if [ "$reqwest_dup" -gt 0 ]; then
            echo "::error::Multiple reqwest versions detected ($reqwest_dup duplicates)"
            cargo tree -d | grep -A2 'reqwest v'
            exit 1
          fi
          # 2. Check for duplicate TLS backend crates that would indicate
          #    multiple TLS stacks compiled into the binary.
          for crate in rustls tokio-rustls hyper-rustls native-tls openssl-sys; do
            dup="$(cargo tree -d | grep -c "^${crate} v" || true)"
            if [ "$dup" -gt 0 ]; then
              echo "::error::Duplicate ${crate} versions detected ($dup duplicates)"
              cargo tree -d | grep -A2 "^${crate} v"
              exit 1
            fi
          done
          echo "✓ Single reqwest version, no duplicate TLS backends"

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Validate all GitHub Actions workflow files (including the examples
  # under examples/github-actions-workflow/) for syntax errors, invalid
  # expressions, and unsupported features — e.g. brace expansion in path
  # filters, which minimatch does not implement.
  actionlint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: rhysd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      # Pinned from actions/checkout@v5 (93cb6efe) to avoid Node.js 20 deprecation.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # Pinned from dtolnay/rust-toolchain@stable (e97e2d8c).
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - run: cargo bench --bench verdict -- --quick
